name: reviewdog
on: [pull_request]

jobs:
  QualityCheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          submodules: true
          ref: ${{ github.event.pull_Request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup detekt
        uses: peter-murray/setup-detekt@v2
        with:
          detekt_version: 1.22
          add_to_path: true

      - name: List changed files
        uses: ankitjain28may/list-files-in-pr@v1.0
        id: list-files
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          outputFormat: 'csv'

      - name: Create comma-separated string
        run: |
          commaSeparatedFiles=""
          for file in ${{ fromJson(format('["{0}"]', steps.list-files.outputs.pullRequestFiles)) }}; do
            commaSeparatedFiles+="${file},"
          done
          commaSeparatedFiles="${commaSeparatedFiles%,}"
          echo "COMMA_SEPARATED_FILES=$commaSeparatedFiles" >> $GITHUB_ENV

      - name: Detekt
        run: |
          detekt-cli -i "${COMMA_SEPARATED_FILES}" 
