name: reviewdog

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  QualityCheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0 
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Get changed Kotlin files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.kt$')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT


      - name: Setup detekt
        uses: peter-murray/setup-detekt@v2
        with:
          detekt_version: 1.23.1 
          add_to_path: true

      - name: Detekt (changed files)
        if: steps.changed-files.outputs.changed_files != ''
        run: detekt-cli -i ${{ steps.changed-files.outputs.changed_files }} --report xml:detekt.xml

      - name: Detekt (no changes)
        if: steps.changed-files.outputs.changed_files == ''
        run: echo "No Kotlin files changed in this pull request."

      - name: Reviewdog
        uses: reviewdog/action-github-check@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: detekt
          level: warning
          path: detekt.xml