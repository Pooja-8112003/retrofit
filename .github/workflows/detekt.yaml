name: reviewdog
on: [pull_request]

jobs:
  QualityCheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup detekt
        uses: peter-murray/setup-detekt@v2
        with:
          detekt_version: 1.22
          add_to_path: true

      - name: List changed files
        uses: ankitjain28may/list-files-in-pr@v1.0
        id: list-files
        with: 
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          outputFormat: json

      - name: Print changed files (debug)
        run: |
          files=$(echo "${{ steps.list-files.outputs.pullRequestFiles }}" | jq -R '[split(",") | map(@json)]')
          echo "Files: $files"
          for file in $(echo "$files" | jq -r '.[]'); do
            echo "Changed Files - $file."
          done

      - name: Detekt
        run: |
          detekt-cli -i $(echo "${{ steps.list-files.outputs.pullRequestFiles }}" | jq -R '[split(",") | map(@json)]' | jq -r '.[]' | sed 's/"//g')